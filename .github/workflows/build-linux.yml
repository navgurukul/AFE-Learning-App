name: Build Linux Installer

on:
  push:
    branches:
      - build/linux
      - main
      - UAT
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsqlite3-dev

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

      - name: Ensure executable permissions on Linux native binaries
        run: |
          chmod +x packages/backend/stt-engine/whisper-cli || true
          chmod +x packages/backend/tts-engine/piper || true

      - name: Build Linux installer (.deb & .AppImage)
        run: pnpm build:installer:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
          retention-days: 14
